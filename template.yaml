AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Don Manuel's 60th memory book. Guest uploads straight to S3, host moderation behind Cognito.

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: Browser origin(s) allowed to call the API and S3, for example https://main.d1abc23def.amplifyapp.com (no trailing slash, no path)
  EventId:
    Type: String
    AllowedPattern: '^[0-9a-f]{32}$'
    Description: 32 hex characters. Generated by scripts/deploy.sh. It is the secret in the guest link.

Resources:
  # ---------------------------------------------------------------- storage
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: abort-stale-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub '${MediaBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  TokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: HMAC key for guest session tokens. Generated by CloudFormation, nobody types it.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # ----------------------------------------------------------- host sign-in
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-host'
      UsernameAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: host-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 8
      AccessTokenValidity: 8
      RefreshTokenValidity: 7
      TokenValidityUnits:
        IdToken: hours
        AccessToken: hours
        RefreshToken: days

  # -------------------------------------------------------------------- API
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      Auth:
        Authorizers:
          HostJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient

  GuestLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-guest'
      RetentionInDays: 14

  HostLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-host'
      RetentionInDays: 14

  GuestFunction:
    Type: AWS::Serverless::Function
    DependsOn: GuestLogs
    Properties:
      FunctionName: !Sub '${AWS::StackName}-guest'
      CodeUri: backend/dist/guest/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          TABLE: !Ref Table
          BUCKET: !Ref MediaBucket
          SECRET_ARN: !Ref TokenSecret
      Policies:
        - Statement:
            - Sid: Records
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
              Resource: !GetAtt Table.Arn
            - Sid: Objects
              Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject, s3:AbortMultipartUpload, s3:ListMultipartUploadParts]
              Resource: !Sub '${MediaBucket.Arn}/events/*'
            - Sid: HeadReturns404NotAccessDenied
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt MediaBucket.Arn
              Condition:
                StringLike:
                  's3:prefix': 'events/*'
            - Sid: TokenKey
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref TokenSecret
      Events:
        Start:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /guest/start, Method: POST}
        CreateMemory:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /guest/memories, Method: POST}
        Parts:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/guest/memories/{id}/parts', Method: POST}
        Complete:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/guest/memories/{id}/complete', Method: POST}
        Remove:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/guest/memories/{id}', Method: DELETE}

  HostFunction:
    Type: AWS::Serverless::Function
    DependsOn: HostLogs
    Properties:
      FunctionName: !Sub '${AWS::StackName}-host'
      CodeUri: backend/dist/host/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          TABLE: !Ref Table
          BUCKET: !Ref MediaBucket
          EVENT_ID: !Ref EventId
      Policies:
        - Statement:
            - Sid: Records
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource: !GetAtt Table.Arn
            - Sid: ReadObjects
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${MediaBucket.Arn}/events/*'
      Events:
        List:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /host/memories, Method: GET, Auth: {Authorizer: HostJwt}}
        Hide:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/host/memories/{id}/hide', Method: POST, Auth: {Authorizer: HostJwt}}
        Show:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/host/memories/{id}/show', Method: POST, Auth: {Authorizer: HostJwt}}
        Rotate:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /host/code/rotate, Method: POST, Auth: {Authorizer: HostJwt}}
        Window:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /host/window, Method: POST, Auth: {Authorizer: HostJwt}}

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  BucketName:
    Value: !Ref MediaBucket
  TableName:
    Value: !Ref Table
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Region:
    Value: !Ref AWS::Region
